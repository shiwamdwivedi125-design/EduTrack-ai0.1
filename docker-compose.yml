version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: edutrack_db
    environment:
      POSTGRES_USER: edutrack
      POSTGRES_PASSWORD: edutrack_password
      POSTGRES_DB: edutrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrack -d edutrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edutrack_backend
    environment:
      DATABASE_URL: postgresql://edutrack:edutrack_password@db:5432/edutrack_db
      SECRET_KEY: ${SECRET_KEY:-edutrack-production-secret-key-change-me}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edutrack_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
