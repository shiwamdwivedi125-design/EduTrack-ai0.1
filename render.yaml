services:
  - type: web
    name: edutrack-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edutrack-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: edutrack-db
    databaseName: edutrack_db
    user: edutrack
    plan: free
    region: singapore
